name: CI

on:
  push:
    branches: [main]
  pull_request:

# Variables de entorno de placeholder - el build no las usa realmente
# (casi todas las rutas son dinamicas, ninguna toca Supabase en tiempo de
# build), pero evitan que un process.env.X inesperado tire la build por
# faltar la variable en este entorno. Nunca son las claves reales.
env:
  NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
  SUPABASE_SERVICE_ROLE_KEY: placeholder-service-role-key
  NEXT_PUBLIC_META_APP_ID: placeholder-app-id
  META_APP_SECRET: placeholder-app-secret
  CRON_SECRET: placeholder-cron-secret

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      # next build corre su propio chequeo completo de TypeScript como parte
      # del proceso -- un "tsc --noEmit" suelto antes del build falla porque
      # LayoutProps y el resto de los tipos que genera Next (.next/types/)
      # todavia no existen en ese punto.
      - name: Build (incluye chequeo de tipos)
        run: npm run build
