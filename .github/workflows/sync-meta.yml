name: Sincronizar Meta cada 30 minutos

# El plan de Vercel de este proyecto (Hobby) solo permite cron jobs una vez
# por día -- cualquier expresión más frecuente falla al desplegar.
#
# OJO: GitHub Actions tampoco corre schedules frecuentes (*/30 * * * *) de
# forma confiable -- en la práctica corrió cada 1 a 6 horas, no cada 30
# min (GitHub documenta que puede demorar o saltear corridas de schedules
# frecuentes bajo carga). Por eso la fuente PRINCIPAL de sincronización
# cada 30 min es pg_cron dentro del propio proyecto de Supabase (ver
# supabase/migrations/0010_pg_cron_sync_meta.sql), que sí corre en
# horario exacto. Este workflow y los cron diarios de vercel.json quedan
# como redes de seguridad adicionales, no como la fuente principal.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sincronizar Meta Ads (Pauta)
        run: |
          curl -sf -X GET "https://clientes.jabmarketing.site/api/cron/sincronizar-pauta" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -o /dev/null -w "sincronizar-pauta: %{http_code}\n"

      - name: Sincronizar Redes (Meta orgánico)
        run: |
          curl -sf -X GET "https://clientes.jabmarketing.site/api/cron/sincronizar-redes" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -o /dev/null -w "sincronizar-redes: %{http_code}\n"
